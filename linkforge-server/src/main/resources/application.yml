# ============================================================
# 通用配置。跟环境无关的放这里，跟环境有关的放 application-{profile}.yml。
# 这样换环境只要切 profile，不用改这个文件。
# ============================================================
spring:
  application:
    name: linkforge
  profiles:
    # 默认走 dev。IDEA 里也可以加 --spring.profiles.active=prod 覆盖
    active: dev

server:
  port: 8080

mybatis-plus:
  configuration:
    # 数据库的 short_code 自动映射到 Java 的 shortCode
    map-underscore-to-camel-case: true
    # 开发期把 SQL 打出来。上线要换成 NoLoggingImpl，否则刷屏 + 有性能开销
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      # 主键由号段模式自己分配，不让 MyBatis-Plus 用雪花算法生成
      id-type: input
      # 逻辑删除字段的全局约定，实体上再打 @TableLogic 生效
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ------------------------------------------------------------
# 阿里云 OSS。AK/SK 不在这里 —— 走环境变量
# OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET，由 SDK 的
# EnvironmentVariableCredentialsProvider 直接读。
# 写进这个文件等于把密钥一起提交到 GitHub。
# ------------------------------------------------------------
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucket-name: miuxuer
    region: cn-beijing

# 本项目自定义配置
linkforge:
  # 拼接短链接前台展示用，换域名时改这里
  domain: http://localhost:8080
  jwt:
    # 签名密钥。和数据库密码同理：值放环境变量，绝不落进这个文件 ——
    # 这个文件是要提交到 GitHub 的，密钥一旦公开，任何人都能签出合法 token
    # 冒充任意用户，整套认证直接失效。
    # 要求：长度 ≥ 32 字节，短了 jjwt 会拒绝（HS256 不允许弱密钥）。
    secret-key: ${JWT_SECRET}
    # 有效期 7 天（毫秒）。JWT 签发后无法主动作废，有效期越长风险窗口越大
    ttl: 604800000
    # 前端携带 token 的请求头名字
    token-name: token
  bloom:
    # 预期短链总数，决定布隆过滤器 bit 数组大小
    expected-insertions: 1000000
    # 可接受的假阳性率：1% 表示 100 个不存在的短码里有 1 个会穿到 DB
    fpp: 0.01
  ratelimit:
    # 滑动窗口：每个 IP 在 60 秒内最多 100 次跳转
    window-seconds: 60
    max-requests: 100

logging:
  level:
    root: info
    com.miuxuer.linkforge: debug
